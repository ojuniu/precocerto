<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>PreçoCerto Preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Layout: moldura de celular; superfícies cinza-quente e vidro fosco sobre fundos desfocados (bokeh), tipografia grande e apertada, CTA grafite em pílula, lima só como sinal. */
:root{
  --bg:#EBEBE6;--card:#F7F7F4;--white:#FFFFFF;--ink:#1B1C1A;--ink2:#2C2E2B;--t2:#6C6E69;--t3:#A3A59F;
  --lime:#C6F25E;--limeD:#8DBB2A;--sage:#6F8468;--sageD:#4E6049;--green:#2E9E58;--red:#E3473F;--amber:#E39B2D;
  --line:rgba(27,28,26,.07);--glass:rgba(255,255,255,.55);--glassD:rgba(30,34,29,.38);--glassB:rgba(255,255,255,.7);
  --sh:0 1px 0 rgba(255,255,255,.8) inset,0 12px 32px -12px rgba(27,28,26,.18);
  --disp:'Inter Tight','Inter',system-ui,-apple-system,'Segoe UI',sans-serif;--body:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  --outer:#D9DAD3;color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--outer);font-family:var(--body);color:var(--ink);display:flex;justify-content:center;align-items:center;-webkit-font-smoothing:antialiased}
.phone{width:100%;max-width:410px;height:100%;max-height:880px;background:var(--bg);position:relative;overflow:hidden;display:flex;flex-direction:column}
@media(min-width:520px){.phone{border-radius:48px;border:8px solid #0E0F0D;height:calc(100% - 28px);box-shadow:0 50px 100px -20px rgba(20,24,18,.45)}}
#root{flex:1;position:relative;display:flex;flex-direction:column;min-height:0}
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;padding:14px 18px 120px;display:flex;flex-direction:column;gap:18px;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}.scroll.full{padding-bottom:30px}
.scroll>*,.sheet .in>*{flex-shrink:0}
h1,h2,h3,p{margin:0}
.d1{font-family:var(--disp);font-size:38px;line-height:.98;font-weight:700;letter-spacing:-1.6px;text-wrap:balance}
.d2{font-family:var(--disp);font-size:26px;line-height:1.05;font-weight:700;letter-spacing:-.9px;text-wrap:balance}
.d3{font-family:var(--disp);font-size:18px;font-weight:600;letter-spacing:-.4px}
.b{font-weight:600;font-size:14.5px;letter-spacing:-.1px}
.s{font-size:13px;color:var(--t2);line-height:1.45}
.xs{font-size:11.5px;color:var(--t3)}
.ov{font-size:11px;font-weight:600;letter-spacing:.4px;color:var(--t3)}
.n{font-family:var(--disp);font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.5px}
.mute{color:var(--t3)}
.row{display:flex;align-items:center;gap:10px}.col{display:flex;flex-direction:column;gap:10px}.f1{flex:1;min-width:0}
.btw{display:flex;align-items:center;justify-content:space-between;gap:10px}
.card{background:var(--card);border-radius:28px;box-shadow:var(--sh)}
.p{padding:16px}.p2{padding:20px}
.glass{background:var(--glass);border:1px solid var(--glassB);backdrop-filter:blur(24px) saturate(1.4);-webkit-backdrop-filter:blur(24px) saturate(1.4)}
.glassD{background:var(--glassD);border:1px solid rgba(255,255,255,.18);backdrop-filter:blur(24px) saturate(1.3);-webkit-backdrop-filter:blur(24px) saturate(1.3);color:#fff}
.ink{background:var(--ink);color:#fff;border-radius:28px}
.ink .s{color:rgba(255,255,255,.66)}.ink .ov{color:rgba(255,255,255,.5)}
.bokeh{position:relative;overflow:hidden;isolation:isolate;background:#7F9177}
.bokeh:before{content:"";position:absolute;inset:-30%;z-index:-2;filter:blur(28px);background:
 radial-gradient(18% 22% at 22% 30%,#E9472F 0,transparent 70%),radial-gradient(20% 24% at 70% 22%,#F5A524 0,transparent 70%),
 radial-gradient(26% 28% at 58% 64%,#93C447 0,transparent 70%),radial-gradient(22% 22% at 28% 74%,#3F6E33 0,transparent 70%),
 radial-gradient(16% 18% at 84% 70%,#C9302C 0,transparent 70%),radial-gradient(30% 30% at 50% 40%,#D9E3C9 0,transparent 70%),
 linear-gradient(160deg,#9AAE8C,#5F7558)}
.bokeh.b2:before{background:radial-gradient(22% 26% at 30% 30%,#F2C14E 0,transparent 70%),radial-gradient(24% 26% at 72% 40%,#E06A3A 0,transparent 70%),radial-gradient(30% 30% at 40% 75%,#8BB35A 0,transparent 70%),linear-gradient(160deg,#B9A57E,#6A7A55)}
.bokeh.b3:before{background:radial-gradient(22% 26% at 70% 28%,#4FA3D9 0,transparent 70%),radial-gradient(26% 26% at 26% 50%,#E8E4D8 0,transparent 70%),radial-gradient(30% 30% at 60% 78%,#2E6E8E 0,transparent 70%),linear-gradient(160deg,#8EA3A8,#3D5560)}
.bokeh.b4:before{background:radial-gradient(22% 26% at 30% 34%,#C6F25E 0,transparent 70%),radial-gradient(26% 28% at 70% 60%,#2E9E58 0,transparent 70%),radial-gradient(20% 20% at 60% 20%,#F5E6A8 0,transparent 70%),linear-gradient(160deg,#7E9A6C,#33482E)}
.photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-1}
.cta{background:var(--ink);color:#fff;border:0;border-radius:999px;padding:17px 22px;font:600 15px var(--body);letter-spacing:-.1px;cursor:pointer;display:flex;justify-content:center;align-items:center;gap:8px;width:100%}
.cta.w{background:#fff;color:var(--ink)}.cta.l{background:var(--lime);color:var(--ink)}.cta.g{background:var(--glass);color:var(--ink);border:1px solid var(--glassB);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.cta.sm{padding:11px 16px;font-size:13px;width:auto}.cta.red{background:var(--red)}
.ib{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:var(--card);border:0;box-shadow:var(--sh);cursor:pointer;color:var(--ink);flex:none;position:relative}
.ib.gl{background:var(--glass);border:1px solid var(--glassB);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-shadow:none}
.ib.dk{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.2);color:#fff;box-shadow:none;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.ib.sm{width:36px;height:36px}
.ib .badge{position:absolute;top:9px;right:10px;width:8px;height:8px;border-radius:50%;background:var(--amber);border:2px solid var(--card)}
button{font-family:var(--body);color:inherit}
button:focus-visible,[tabindex]:focus-visible,input:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.tag{display:inline-flex;align-items:center;gap:5px;padding:6px 11px;border-radius:999px;font-size:11.5px;font-weight:600;white-space:nowrap;background:var(--white);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.05)}
.tag.dk{background:var(--ink);color:#fff}.tag.l{background:var(--lime);color:var(--ink)}.tag.gl{background:rgba(255,255,255,.18);color:#fff;border:1px solid rgba(255,255,255,.22);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);box-shadow:none}
.tag.up{color:var(--green)}.tag.dn{color:var(--red)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--green);display:inline-block}
.dot.o{background:var(--amber)}
.pills{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -18px;padding:2px 18px}.pills::-webkit-scrollbar{display:none}
.pill{border:0;background:var(--card);padding:10px 15px;border-radius:999px;font:500 13px var(--body);color:var(--t2);cursor:pointer;white-space:nowrap;box-shadow:var(--sh)}
.pill.on{background:var(--ink);color:#fff}
.search{display:flex;align-items:center;gap:10px;padding:15px 18px;border-radius:999px;background:var(--card);box-shadow:var(--sh);color:var(--t3);font-size:14px;cursor:pointer;flex:1;min-width:0}
.search input{border:0;background:none;outline:0;font:500 15px var(--body);flex:1;min-width:0;color:var(--ink)}
.av{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font:600 15px var(--disp);color:#fff;flex:none;background:var(--sageD);cursor:pointer}
.plate{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;font-size:30px;flex:none;background:radial-gradient(circle at 50% 35%,#fff 0,#F1F1EC 70%);box-shadow:0 8px 18px -8px rgba(0,0,0,.25),inset 0 -2px 4px rgba(0,0,0,.04)}
.plate.lg{width:150px;height:150px;font-size:84px}.plate.md{width:44px;height:44px;font-size:23px}
.li{display:flex;align-items:center;gap:12px;padding:12px 14px 12px 12px;cursor:pointer}
.list{display:flex;flex-direction:column}.list>.li+.li{border-top:1px solid var(--line)}
.rk{width:28px;font:700 14px var(--disp);color:var(--t3);text-align:center;flex:none}
.rk.g{color:var(--ink)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{padding:14px;display:flex;flex-direction:column;gap:4px;border-radius:22px;background:var(--card);box-shadow:var(--sh)}
.hscroll{display:flex;gap:12px;overflow-x:auto;scrollbar-width:none;margin:0 -18px;padding:4px 18px 10px;scroll-snap-type:x mandatory}.hscroll::-webkit-scrollbar{display:none}
.hscroll>*{scroll-snap-align:start;flex:none}
.pc{width:156px;padding:14px;display:flex;flex-direction:column;gap:10px;cursor:pointer}
.pc .plate{width:100%;height:110px;border-radius:22px;font-size:58px;background:radial-gradient(circle at 50% 40%,#fff 0,#EFEFEA 75%)}
.sec{display:flex;align-items:baseline;justify-content:space-between}
.sec button{background:none;border:0;font:500 13px var(--body);color:var(--t2);cursor:pointer}
.hd{display:flex;align-items:center;gap:10px}.hd h2{flex:1;text-align:center;font:600 17px var(--disp);letter-spacing:-.3px}
.bar{height:6px;background:rgba(27,28,26,.08);border-radius:99px;overflow:hidden}.bar>i{display:block;height:100%;background:var(--ink);border-radius:99px;transition:width .3s}
.ink .bar{background:rgba(255,255,255,.16)}.ink .bar>i{background:var(--lime)}
.seg{display:flex;background:rgba(27,28,26,.06);border-radius:999px;padding:4px}
.seg button{flex:1;border:0;background:none;padding:10px;border-radius:999px;font:500 13px var(--body);color:var(--t2);cursor:pointer}
.seg button.on{background:var(--white);color:var(--ink);box-shadow:0 2px 10px rgba(0,0,0,.07);font-weight:600}
.tabbar{position:absolute;left:0;right:0;bottom:0;padding:0 16px calc(14px + env(safe-area-inset-bottom,0px));z-index:6}
.tabbar .in{display:flex;align-items:center;justify-content:space-between;padding:8px;border-radius:999px;background:rgba(247,247,244,.72);border:1px solid rgba(255,255,255,.8);backdrop-filter:blur(24px) saturate(1.4);-webkit-backdrop-filter:blur(24px) saturate(1.4);box-shadow:0 18px 40px -16px rgba(0,0,0,.3)}
.tabbar.dk .in{background:rgba(20,22,19,.55);border-color:rgba(255,255,255,.12)}
.tab{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:none;border:0;cursor:pointer;color:var(--t3)}
.tabbar.dk .tab{color:rgba(255,255,255,.55)}
.tab.on{background:var(--white);color:var(--ink);box-shadow:0 4px 12px rgba(0,0,0,.08)}
.tabbar.dk .tab.on{background:rgba(255,255,255,.16);color:#fff;box-shadow:none}
.fab{width:60px;height:60px;border-radius:50%;background:var(--ink);display:grid;place-items:center;border:0;cursor:pointer;color:var(--lime);box-shadow:0 0 0 4px rgba(198,242,94,.35)}
.cam{position:absolute;inset:0;display:flex;flex-direction:column;color:#fff}
.frame{width:78%;aspect-ratio:1;max-width:100%;position:relative;display:grid;place-items:center}
.frame i{position:absolute;width:62px;height:62px;border:3px solid var(--lime)}
.frame i:nth-child(1){left:0;top:0;border-right:0;border-bottom:0;border-radius:28px 0 0 0}.frame i:nth-child(2){right:0;top:0;border-left:0;border-bottom:0;border-radius:0 28px 0 0}
.frame i:nth-child(3){left:0;bottom:0;border-right:0;border-top:0;border-radius:0 0 0 28px}.frame i:nth-child(4){right:0;bottom:0;border-left:0;border-top:0;border-radius:0 0 28px 0}
.label{background:#FDE047;color:#111;border-radius:6px;padding:14px 16px;width:72%;font-weight:700;box-shadow:0 18px 40px rgba(0,0,0,.35);font-family:var(--disp)}
.laser{position:absolute;left:4%;right:4%;height:40%;top:6%;background:linear-gradient(180deg,rgba(198,242,94,0),rgba(198,242,94,.28));border-bottom:2px solid var(--lime);animation:las 1.3s ease-in-out infinite alternate}
@keyframes las{from{top:4%}to{top:54%}}
.modes{display:flex;gap:8px;justify-content:center;padding:0 16px}
.mode{border-radius:18px;padding:12px 10px;display:flex;flex-direction:column;align-items:center;gap:6px;font:500 11px var(--body);cursor:pointer;min-width:74px;color:#fff}
.mode.on{background:rgba(198,242,94,.22);border-color:rgba(198,242,94,.7)}
.shutter{width:80px;height:80px;border-radius:50%;border:3px solid var(--lime);background:transparent;display:grid;place-items:center;cursor:pointer;box-shadow:0 0 30px rgba(198,242,94,.45)}
.shutter span{width:62px;height:62px;border-radius:50%;background:var(--ink2);display:grid;place-items:center}
.ann{position:absolute;display:flex;align-items:center;pointer-events:none}
.ann b{font:600 12px var(--body);padding:7px 12px;border-radius:999px;white-space:nowrap}
.ann i{display:block;height:1px;width:40px;background:rgba(255,255,255,.75)}
.ann em{width:9px;height:9px;border-radius:50%;background:#fff;box-shadow:0 0 0 3px rgba(255,255,255,.3)}
.map{position:relative;height:340px;border-radius:30px;overflow:hidden;background:#E3E4DC;box-shadow:var(--sh)}
.map svg.base{position:absolute;inset:0;width:100%;height:100%}
.pin{position:absolute;transform:translate(-50%,-100%);display:flex;flex-direction:column;align-items:center;cursor:pointer;background:none;border:0;padding:0}
.pin b{background:#fff;color:var(--ink);font:700 12px var(--disp);padding:6px 10px;border-radius:999px;white-space:nowrap;box-shadow:0 6px 16px rgba(0,0,0,.14)}
.pin.best b{background:var(--ink);color:var(--lime)}.pin.sel b{outline:2px solid var(--ink);outline-offset:2px}
.pin:after{content:"";width:1px;height:12px;background:var(--ink)}
.me{position:absolute;width:16px;height:16px;border-radius:50%;background:#2F7BE0;border:3px solid #fff;box-shadow:0 0 0 10px rgba(47,123,224,.16);transform:translate(-50%,-50%)}
.feed{position:absolute;inset:0;overflow-y:auto;scroll-snap-type:y mandatory;scrollbar-width:none;background:#0E0F0D}
.feed::-webkit-scrollbar{display:none}
.reel{height:100%;scroll-snap-align:start;position:relative;color:#fff;display:flex;flex-direction:column;justify-content:flex-end;padding:20px 18px 118px;overflow:hidden;isolation:isolate}
.reel .big{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);font-size:150px;filter:drop-shadow(0 30px 40px rgba(0,0,0,.35));z-index:-1}
.reel .shade{position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(0,0,0,.35),rgba(0,0,0,0) 22%,rgba(0,0,0,0) 48%,rgba(0,0,0,.78))}
.side{position:absolute;right:14px;bottom:132px;display:flex;flex-direction:column;gap:18px;align-items:center}
.side button{background:none;border:0;color:#fff;display:flex;flex-direction:column;align-items:center;gap:4px;font:600 11px var(--body);cursor:pointer}
.side .c{width:48px;height:48px;border-radius:50%;display:grid;place-items:center}
.reel .info{display:flex;flex-direction:column;gap:10px;max-width:80%}
.ftop{position:absolute;top:0;left:0;right:0;z-index:5;display:flex;align-items:center;justify-content:space-between;padding:14px 16px}
.ftabs{display:flex;gap:18px;font:600 15px var(--disp);color:rgba(255,255,255,.55)}
.ftabs span{cursor:pointer;padding-bottom:4px}.ftabs .on{color:#fff;border-bottom:2px solid var(--lime)}
.pricecard{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:18px;max-width:280px}
.chk{width:30px;height:30px;border-radius:50%;border:1.5px solid rgba(27,28,26,.2);display:grid;place-items:center;flex:none;background:#fff}
.chk.on{background:var(--ink);border-color:var(--ink);color:var(--lime)}.chk.bad{background:var(--red);border-color:var(--red);color:#fff}
.done{text-decoration:line-through;color:var(--t3)}
.lnk{background:none;border:0;padding:0;font:600 12px var(--body);color:var(--red);cursor:pointer}
.field{display:flex;flex-direction:column;gap:7px}.field label{font-size:12px;font-weight:600;color:var(--t2)}
.field input,.field select,.field textarea{font:500 15px var(--body);padding:15px 16px;border-radius:18px;border:0;background:var(--card);box-shadow:var(--sh);color:var(--ink);resize:none}
.toast{position:absolute;left:16px;right:16px;top:14px;background:var(--ink);color:#fff;border-radius:20px;padding:14px 16px;font-size:13.5px;font-weight:500;z-index:40;display:flex;gap:10px;align-items:center;box-shadow:0 16px 36px rgba(0,0,0,.3)}
.sheet{position:absolute;inset:0;z-index:30;background:rgba(14,15,13,.4);display:flex;flex-direction:column;justify-content:flex-end}
.sheet .in{background:var(--bg);border-radius:32px 32px 0 0;max-height:90%;overflow-y:auto;padding:10px 18px calc(24px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
.grab{width:40px;height:5px;border-radius:9px;background:rgba(27,28,26,.15);align-self:center}
.flower{position:relative;width:270px;height:270px;margin:8px auto;max-width:100%}
.petal{position:absolute;width:96px;height:96px;border-radius:50%;display:grid;place-items:center;text-align:center;font-size:11.5px;color:var(--t2);background:radial-gradient(circle at 50% 75%,rgba(198,242,94,.75),rgba(245,166,35,.25) 45%,rgba(255,255,255,.95) 72%)}
.petal b{display:block;font:700 17px var(--disp);color:var(--ink)}
.core{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:84px;height:84px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:44px;box-shadow:0 10px 24px rgba(0,0,0,.15);border:4px solid #fff}
.spark{width:100%;height:120px}
.banner{font-size:10.5px;color:var(--t3);text-align:center;padding:5px 10px;letter-spacing:.2px}
.thin{border-top:1px solid var(--line)}
.vote{display:flex;flex-direction:column;align-items:center;gap:2px;font:700 13px var(--disp)}
.cmt{display:flex;gap:10px}
.grid3i{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;border-radius:20px;overflow:hidden}
.grid3i>div{aspect-ratio:3/4;display:flex;align-items:flex-end;padding:8px;color:#fff;font-size:11px;font-weight:600;position:relative;cursor:pointer}
.badge2{width:64px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:10.5px;color:var(--t2);text-align:center}
.badge2 span{width:52px;height:52px;border-radius:18px;display:grid;place-items:center;background:var(--card);box-shadow:var(--sh)}
/* fotos de produto */
.ph{position:relative;overflow:hidden;display:grid;place-items:center;flex:none;background:#fff}
.ph img{width:100%;height:100%;object-fit:contain;padding:8%;mix-blend-mode:multiply}
.ph.cover img{object-fit:cover;padding:0;mix-blend-mode:normal}
.ph .ini{font:600 10px var(--disp);color:var(--t3);text-align:center;padding:4px;letter-spacing:-.1px;line-height:1.1}
.ph.plate{background:#fff}
.pc .ph.plate{width:100%;height:118px;border-radius:22px}
.chipimg{width:22px;height:22px;border-radius:50%;display:inline-grid;vertical-align:middle;margin:-4px 2px -4px -6px;box-shadow:none}
.chipimg img{padding:2px}
/* mapa estilo apps de mapa */
.gm{position:absolute;inset:0;overflow:hidden;background:#F2F1EC;touch-action:none;cursor:grab}
.gm:active{cursor:grabbing}
.gm .layer{position:absolute;left:0;top:0;width:100%;height:100%}
.gm .tile{position:absolute;width:256px;height:256px;user-select:none;-webkit-user-drag:none;pointer-events:none}
.gm svg{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
.gpin{position:absolute;transform:translate(-50%,-100%);background:none;border:0;padding:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;z-index:2}
.gpin b{display:flex;align-items:center;gap:5px;background:#fff;color:#202124;font:700 12.5px var(--disp);padding:6px 10px 6px 6px;border-radius:999px;white-space:nowrap;box-shadow:0 2px 6px rgba(60,64,67,.3),0 1px 2px rgba(60,64,67,.2)}
.gpin b i{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;color:#fff;font:700 9px var(--disp);font-style:normal}

Object.entries(CM).forEach(([id,f])=>{if(!PIMG[id])PIMG[id]=`https://commons.wikimedia.org/wiki/Special:FilePath/${f}?width=500`});
const ini=id=>`<span class="ini">${pr(id).n.split(' ').slice(0,2).join(' ')}</span>`;
const pimg=id=>PIMG[id]?`<img src="${PIMG[id]}" alt="" loading="lazy" onerror="imgFail('${id}',this)">`:ini(id);
const ph=(id,cls='',st='')=>`<div class="ph ${cls}" data-p="${id}" style="${st}">${pimg(id)}</div>`;
const bgp=id=>`data-pb="${id}" style="background-image:${PIMG[id]?`url('${PIMG[id]}')`:'none'}"`;
function imgFail(id,el){const par=el.parentNode;if(par)par.innerHTML=ini(id);if(CM[id]&&PIMG[id]&&PIMG[id].includes('wikimedia')){delete PIMG[id];CM[id]=null;loadImgs()}}
function applyImg(id){document.querySelectorAll(`[data-p="${id}"]`).forEach(el=>{el.innerHTML=pimg(id)});document.querySelectorAll(`[data-pb="${id}"]`).forEach(el=>{el.style.backgroundImage=`url("${PIMG[id]}")`})}
let loadingImgs=false;
async function loadImgs(){
 if(loadingImgs)return;loadingImgs=true;
 for(const p of PROD){
  if(PIMG[p.id])continue;
  try{const r=await fetch(`https://world.openfoodfacts.org/cgi/search.pl?search_terms=${encodeURIComponent(PQ[p.id])}&search_simple=1&action=process&json=1&page_size=12&fields=product_name,image_front_url,countries_tags`);
   const j=await r.json();const c=(j.products||[]).filter(x=>x.image_front_url);const best=c.find(x=>(x.countries_tags||[]).includes('en:brazil'))||c[0];
   if(best){PIMG[p.id]=best.image_front_url;applyImg(p.id);try{localStorage.setItem('pc_pimg',JSON.stringify(PIMG))}catch(e){}}}catch(e){}
  await new Promise(r=>setTimeout(r,350));
 }
 loadingImgs=false;
}

/* ---------- mapa ---------- */
const MAPST={z:12,cx:null,cy:null,moved:false};
function wpx(lat,lng,z){const s=256*Math.pow(2,z);const sn=Math.sin(lat*Math.PI/180);return [(lng+180)/360*s,(0.5-Math.log((1+sn)/(1-sn))/(4*Math.PI))*s]}
const ROADS=[{w:'hw',pts:[[.08,-.04],[.05,-.015],[.025,-.008],[.005,-.017],[-.02,-.032],[-.055,-.037]]},{w:'hw',pts:[[-.004,.021],[.017,.03],[.042,.036],[.072,.043]]},{w:'ar',pts:[[-.004,.018],[.016,.012],[.039,.002],[.06,-.004]]},{w:'ar',pts:[[-.007,.019],[-.014,0],[-.022,-.027],[-.028,-.062]]},{w:'ar',pts:[[.007,.029],[-.007,.02],[-.023,.026],[-.04,.036]]},{w:'ar',pts:[[-.006,.006],[-.011,-.027],[-.016,-.072]]},{w:'ar',pts:[[-.023,.008],[-.043,.003],[-.063,-.002]]}];
const PARKS=[[[-.01,.024],[-.015,.022],[-.017,.027],[-.012,.029]],[[-.036,.04],[-.05,.033],[-.056,.05],[-.041,.056]],[[.047,.018],[.04,.013],[.036,.023],[.044,.028]]];
function drawMap(){
 const el=document.getElementById('gm');if(!el)return;const W=el.clientWidth,H=el.clientHeight;
 const br=isBR(),C=br?{c:[-20.5,-46.5],z:5}:CITIES[S.city];
 if(MAPST.cx==null||MAPST.city!==S.city){MAPST.city=S.city;MAPST.z=C.z;const c=wpx(C.c[0],C.c[1],MAPST.z);MAPST.cx=c[0];MAPST.cy=c[1]+H*0.16;}
 const z=MAPST.z,tlx=MAPST.cx-W/2,tly=MAPST.cy-H/2;
 const pp=(la,ln)=>{const w=wpx(la,ln,z);return [w[0]-tlx,w[1]-tly]};
 let g='';
 if(!br){
  const c0=C.c,sc=Math.pow(2,z-12),rel=q=>[c0[0]+q[0],c0[1]+q[1]];
  const path=pts=>pts.map((q,i)=>{const a=pp(...rel(q));return (i?'L':'M')+a[0].toFixed(1)+' '+a[1].toFixed(1)}).join(' ');
  const st=0.0032,L=0.07;
  for(let i=-16;i<=16;i++)for(const [dx,dy] of [[1,1],[1,-1]]){const ox=i*st*dy,oy=-i*st*dx;const a=pp(c0[0]+oy-L*dx*.7,c0[1]+ox-L*dy*.7),b=pp(c0[0]+oy+L*dx*.7,c0[1]+ox+L*dy*.7);g+=`<line x1="${a[0].toFixed(1)}" y1="${a[1].toFixed(1)}" x2="${b[0].toFixed(1)}" y2="${b[1].toFixed(1)}" stroke="#fff" stroke-width="${Math.max(1,1.2*sc)}"/>`}
  g+=PARKS.map(pg=>`<path d="${path(pg)}Z" fill="#C8E6C9"/>`).join('');
  g+=`<path d="${path([[-.02,-.07],[-.014,-.03],[-.008,0],[0,.03],[.01,.06]])}" stroke="#AADAFF" stroke-width="${3*sc}" fill="none"/>`;
  for(const r of ROADS){const w=(r.w==='hw'?6:4.5)*Math.min(sc,2.4);g+=`<path d="${path(r.pts)}" stroke="${r.w==='hw'?'#F9AB00':'#DADCE0'}" stroke-width="${w+2}" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="${path(r.pts)}" stroke="${r.w==='hw'?'#FDE293':'#fff'}" stroke-width="${w}" fill="none" stroke-linecap="round" stroke-linejoin="round"/>`}
 }else{g=`<rect x="-5000" y="-5000" width="10000" height="10000" fill="#F2F1EC"/>`}
 let tiles='';const x0=Math.floor(tlx/256),x1=Math.floor((tlx+W)/256),y0=Math.floor(tly/256),y1=Math.floor((tly+H)/256),n=Math.pow(2,z);
 for(let x=x0;x<=x1;x++)for(let y=y0;y<=y1;y++){if(y<0||y>=n)continue;const xx=((x%n)+n)%n;tiles+=`<img class="tile" alt="" src="https://${'abcd'[(xx+y+4)%4]}.basemaps.cartocdn.com/rastertiles/voyager/${z}/${xx}/${y}@2x.png" style="left:${x*256-tlx}px;top:${y*256-tly}px" onerror="this.remove()">`}
 const p=pr(S.mapProd);let pins='';
 if(br){
  pins=Object.entries(CITIES).map(([id,ci])=>{const a=pp(ci.c[0],ci.c[1]);return `<button class="gpin city" style="left:${a[0]}px;top:${a[1]}px" onclick="if(!MAPST.moved)setCity('${id}')" aria-label="${ci.n}"><b>${({bh:'BH',jp:'J. Pinheiro',sp:'São Paulo',rj:'Rio'})[id]||ci.n} · ${brl(p.b*ci.f*.95)}</b></button>`}).join('');
 }else{
  const ch=cheapest(p.id);
  pins=ch.map((m,i)=>{const a=pp(m.g[0],m.g[1]);const fr=fresh(PR[m.id][p.id].age);if(S.onlyFresh&&fr==='r')return '';return `<button class="gpin ${i===0?'best':''} ${m.id===S.mapSel?'sel':''} ${fr==='r'?'stale':''}" style="left:${a[0]}px;top:${a[1]}px" onclick="if(!MAPST.moved){S.mapSel='${m.id}';render()}" aria-label="${m.n}"><b><i style="background:${m.c}">${m.n[0]}</i>${brl(pv(m.id,p.id))}<span class="fd ${fr}"></span></b></button>`}).join('');
  if(S.city==='jp'||S.city==='bh'){const me=S.city==='jp'?[-17.7445,-46.1735]:[-19.912,-43.951];const a=pp(me[0],me[1]);pins+=`<span class="gme" style="left:${a[0]}px;top:${a[1]}px"></span>`}
 }
 el.querySelector('.layer').innerHTML=`<svg width="${W}" height="${H}">${g}</svg>${tiles}${pins}`;
}
function zoomMap(d){const nz=Math.min(17,Math.max(3,MAPST.z+d));if(nz===MAPST.z)return;const f=Math.pow(2,nz-MAPST.z);MAPST.cx*=f;MAPST.cy*=f;MAPST.z=nz;drawMap()}
function initMap(){

 el.addEventListener('pointerdown',e=>{down=true;MAPST.moved=false;sx=e.clientX;sy=e.clientY});
 window.onpointermove=e=>{if(!down)return;const dx=e.clientX-sx,dy=e.clientY-sy;if(Math.abs(dx)+Math.abs(dy)>3)MAPST.moved=true;sx=e.clientX;sy=e.clientY;MAPST.cx-=dx;MAPST.cy-=dy;drawMap()};
 window.onpointerup=()=>{down=false;setTimeout(()=>MAPST.moved=false,0)};

}

 if(onlyUpd){S.me.pts+=20;S.scanFor=null;S.stack.pop();S.route=S.stack.pop()||'tabs';S.toast='Preço atualizado para todos · +20 pts';render(true);setTimeout(()=>{S.toast=null;render()},2000);return}
 const ex=S.cart.items.find(i=>i.id===d.id);ex?ex.q+=d.q:S.cart.items.push({id:d.id,q:d.q,p:d.p,st:null,ch:null,t:new Date().toTimeString().slice(0,5)});S.me.pts+=5;S.next++;

 <div class="cseg">${['Foto','Vídeo','Dica','Enquete','Pergunta'].map(x=>`<button class="${t===x?'on':''}" style="font-size:12px" onclick="S.ptype='${x}';render()">${x==='Dica'?'Texto':x}</button>`).join('')}</div>
 ${t==='Vídeo'||t==='Foto'?`<div class="bokeh b2" style="border-radius:28px;height:220px;display:grid;place-items:center;color:#fff;cursor:pointer" onclick="toast('Abrindo câmera…')">${IMG('photo-1542838132-92c53300491e')}<div style="position:absolute;inset:0;background:rgba(0,0,0,.25);z-index:-1"></div><div class="col" style="align-items:center"><div class="ib dk" style="width:64px;height:64px">${ic(t==='Vídeo'?'video':'camera',28)}</div><p class="b">${t==='Vídeo'?'Gravar ou escolher vídeo (até 60 s)':'Tirar ou escolher fotos'}</p></div></div>`:''}
 <div class="field"><label for="pt">${t==='Pergunta'||t==='Enquete'?'Sua pergunta':t==='Dica'?'Sua dica':'Legenda'}</label><textarea id="pt" rows="3" placeholder="${t==='Enquete'?'Ex.: onde está a carne mais barata?':t==='Pergunta'?'Ex.: onde acho whey barato?':'Conte a promoção e se vale a pena'}"></textarea></div>
 ${t==='Enquete'?`<div class="col" style="gap:8px">${[1,2,3].map(i=>`<div class="field"><input id="po${i}" placeholder="Opção ${i}" value="${(ms[i-1]||{n:''}).n}"></div>`).join('')}</div>`:''}
 ${t==='Dica'?`<div class="row" style="gap:8px">${[['','Simples'],['dark','Destaque escuro'],['lime','Destaque verde']].map(([s,l])=>`<button class="pill ${(S.pstyle||'')===s?'on':''}" style="font-size:12px" onclick="S.pstyle='${s}';render()">${l}</button>`).join('')}</div>`:''}
 ${t!=='Pergunta'&&t!=='Enquete'?`<div class="g2"><div class="field"><label for="pm">Mercado</label><select id="pm">${ms.map(m=>`<option value="${m.id}">${m.n}</option>`).join('')}</select></div><div class="field"><label for="pp">Produto</label><select id="pp">${PROD.map(p=>`<option value="${p.id}">${p.n}</option>`).join('')}</select></div></div>
 <div class="field"><label for="pv">Preço visto</label><input id="pv" inputmode="decimal" placeholder="0,00"></div>
 <div class="why">${ic('shield',13)} O preço marcado entra na média da comunidade e deixa o produto <span class="fd g"></span> verde no mercado.</div>`:''}
 <p class="xs">Publicando em ${isBR()?'João Pinheiro':CITIES[S.city].n}</p>
 <button class="cta" onclick="publish()">Publicar</button>`;
}
function publish(){
 const t=S.ptype||'Foto',txt=document.getElementById('pt').value.trim(),city=isBR()?'jp':S.city;
 if(t==='Pergunta'){QA.unshift({u:'me',city,q:txt||'Onde está o leite mais barato hoje?',a:0,v:0,t:'agora',best:null});S.commTab='qa'}
 else{const id=900+S.myPosts.length;S.comments[id]=[];
  if(t==='Enquete')S.myPosts.unshift({id,u:'me',city,type:'poll',t:txt||'Onde você compra carne mais barato?',poll:[1,2,3].map(i=>[document.getElementById('po'+i).value||'Opção '+i,0]),voted:null,mk:MKS()[0]?.id||'jpc',pd:'picanha',l:0,cm:0,sv:0,time:'agora'});
  else{const mid=document.getElementById('pm').value,pid=document.getElementById('pp').value,pvv=parseFloat((document.getElementById('pv').value||'').replace(',','.'))||pv(mid,pid);
   PR[mid][pid].v=pvv;PR[mid][pid].age=1;PR[mid][pid].n++;
   S.myPosts.unshift({id,u:'me',city,type:t==='Foto'?'photo':t==='Vídeo'?'video':'text',style:S.pstyle||'',t:txt||'Promoção boa hoje, corre!',mk:mid,pd:pid,pics:[pid],pr:pvv,l:0,cm:0,sv:0,dur:'0:15',img:'',bk:'b4',time:'agora'})}
  S.commTab=t==='Vídeo'?'videos':'feed';S.vi=0}
 S.me.pts+=15;S.toast='Publicado · +15 pts';S.tab='comm';S.route='tabs';S.stack=[];render(true);setTimeout(()=>{S.toast=null;render()},2000);
}

/* ---------- perfis ---------- */
function userView(){
 const u=USERS[S.user],f=S.following.has(S.user);const ps=POSTS.filter(p=>p.u===S.user);
 return `${hd(u.h,`<button class="ib" aria-label="Mais opções" onclick="toast('Denunciar ou bloquear')">${ic('more')}</button>`)}
 <div class="col" style="align-items:center;gap:10px"><div class="av" style="background:${u.c};width:96px;height:96px;font-size:36px;box-shadow:0 0 0 4px var(--bg),0 0 0 6px var(--lime)">${u.n[0]}</div><p class="d2">${u.n}</p><div class="row" style="gap:6px"><span class="tag dk">${ic('shield',13,'#C6F25E')} ${u.lvl}</span><span class="tag">${ic('pin',12)} ${CITIES[u.city].n}</span></div><p class="s" style="text-align:center;max-width:290px">${u.bio}</p></div>
 <div class="g3"><div class="stat" style="align-items:center"><span class="n" style="font-size:20px">${k(u.fol+(f?1:0))}</span><span class="xs">seguidores</span></div><div class="stat" style="align-items:center"><span class="n" style="font-size:20px">${k(u.sent)}</span><span class="xs">preços</span></div><div class="stat" style="align-items:center"><span class="n" style="font-size:20px">98%</span><span class="xs">precisão</span></div></div>
 <div class="row"><button class="cta ${f?'g':''}" onclick="follow('${S.user}')">${f?'Seguindo':'Seguir'}</button><button class="cta g" onclick="toast('Mensagens em breve')">${ic('chat',18)} Mensagem</button></div>
 <p class="ov">PUBLICAÇÕES</p><div class="fl">${ps.map(postCard).join('')||'<p class="s">Nenhuma publicação ainda.</p>'}</div>`;
}
function profile(){
 const favs=MK.filter(m=>S.favM.has(m.id));
 return `${hd('Perfil',`<button class="ib" aria-label="Notificações" onclick="sheet('notif')">${ic('bell')}</button>`)}
 <div class="col" style="align-items:center;gap:10px"><div class="av" style="background:var(--ink);width:96px;height:96px;font-size:36px;box-shadow:0 0 0 4px var(--bg),0 0 0 6px var(--lime)">J</div><p class="d2">Juniu</p><p class="s">@juniu</p><div class="row" style="gap:6px"><span class="tag dk">${ic('shield',13,'#C6F25E')} ${S.me.lvl} · ${k(S.me.pts)} pts</span>${cityPill()}</div></div>
 <div class="card p col" style="gap:8px"><div class="btw"><span class="s">Próximo nível: Fiscal Diamante</span><span class="xs">${S.me.pts}/2.500</span></div><div class="bar"><i style="width:${Math.min(100,S.me.pts/25)}%"></i></div></div>
 <div class="g3"><div class="stat" style="align-items:center"><span class="n" style="font-size:20px">${S.me.sent}</span><span class="xs">preços enviados</span></div><div class="stat" style="align-items:center"><span class="n" style="font-size:20px">1,2 mil</span><span class="xs">seguidores</span></div><div class="stat" style="align-items:center"><span class="n" style="font-size:20px;color:var(--green)">R$ 486</span><span class="xs">economizado</span></div></div>
 <p class="ov">CONQUISTAS</p>
 <div class="row" style="justify-content:space-between">${[['shield','Fiscal Ouro'],['trophy','Top 5 da cidade'],['flag','7 erros pegos'],['fire','30 dias seguidos']].map(([i,l])=>`<div class="badge2"><span>${ic(i,22)}</span>${l}</div>`).join('')}</div>
 <p class="ov">MERCADOS FAVORITOS</p>
 <div class="card list">${favs.map(m=>`<div class="li" onclick="go('market',{market:'${m.id}'})" tabindex="0"><div class="av" style="background:${m.c}">${m.n[0]}</div><div class="f1"><p class="b" style="font-size:14px">${m.n}</p><p class="meta"><span class="fd ${fresh(mktAge(m.id))}"></span> ${m.b} · ${CITIES[m.city].n}</p></div><span style="color:var(--red)">♥</span></div>`).join('')||'<p class="s p">Nenhum favorito ainda.</p>'}</div>
 <p class="ov">MINHAS PUBLICAÇÕES</p>
 <div class="fl">${S.myPosts.map(postCard).join('')||`<div class="card p row"><p class="s f1">Você ainda não publicou nada.</p><button class="cta sm" onclick="S.ptype='Foto';go('post')">Publicar</button></div>`}</div>
 <div class="ink p2 col" style="gap:10px"><div class="row" style="gap:8px">${ic('star',18,'#C6F25E')}<p class="d3">PreçoCerto Premium</p></div><p class="s">Prateleira inteira de uma vez, histórico completo, alertas e IA sem limite, rankings do Brasil completos.</p><button class="cta l" onclick="toast('Planos em breve')">Assinar por R$ 9,90/mês</button></div>
 <button class="cta g" onclick="S.route='onb';render(true)">Ver tela de abertura</button>`;
}
function notifSheet(){
 return `<div class="grab"></div><div class="btw"><h2 class="d3">Notificações</h2><button class="ib sm" aria-label="Fechar" onclick="sheet(null)">${ic('x',16)}</button></div>
 <div class="card list">${[['down','Coca-Cola 2L baixou para R$ 9,29 no Assaí','10 min'],['camera','5 preços do Supermercado Central estão sem foto há 4 dias','1 h'],['heart','@lu_jp curtiu sua dica de café','2 h'],['chat','Responderam sua pergunta','3 h'],['trophy','Você subiu para Fiscal Ouro','ontem']].map(([i,t,h])=>`<div class="li"><div class="ib sm">${ic(i,16)}</div><p class="s f1" style="color:var(--ink)">${t}</p><span class="xs">${h}</span></div>`).join('')}</div>`;
}

/* ---------- render ---------- */
function tabbar(dark){
 const t=(k2,i,l)=>`<button class="tab ${S.tab===k2?'on':''}" onclick="tab('${k2}')" aria-label="${l}">${ic(i,21)}<span>${l}</span></button>`;
 return `<div class="tabbar ${dark?'dk':''}"><div class="in">${t('home','home','Início')}${t('map','map','Mapa')}<button class="fab" aria-label="Fotografar etiqueta" onclick="S.scanFor=null;go('scan')">${ic('scan',26,'#C6F25E',1.9)}</button>${t('comm','users','Comunidade')}${t('shop','cart','Compras')}</div></div>`;
}
function render(reset){
 const root=document.getElementById('root');const sc=root.querySelector('.scroll');const keep=!reset&&sc?sc.scrollTop:0;
 const fe=root.querySelector('#feed');const fy=fe?fe.scrollTop:0;
 const ae=document.activeElement;const focusId=ae&&ae.id;let sel=null;try{sel=ae.selectionStart}catch(e){}
 let html='';
 if(S.route==='onb')html=onb();
 else if(S.route==='scan')html=scanner();
 else if(S.route==='tabs'&&S.tab==='comm'&&S.commTab==='videos')html=videos()+tabbar(true);
 else if(S.route==='tabs'&&S.tab==='map')html=mapTab()+tabbar();
 else{
  const V={search,product,market,checkout,conference,confirm:confirmItem,listDetail,diet,user:userView,post:postView,profile}[S.route];
  const T={home,comm,shop}[S.tab];const isTab=S.route==='tabs';
  html=`<div class="scroll ${isTab?'':'full'}">${isTab?T():V()}</div>${isTab?tabbar():''}`;
  if(isTab&&S.tab==='comm'&&S.commTab!=='rank')html+=`<button class="pfab" onclick="S.ptype='${S.commTab==='qa'?'Pergunta':'Foto'}';go('post')">${ic('plus',18)} ${S.commTab==='qa'?'Perguntar':'Publicar'}</button>`;
 }
 if(S.sheet){const f={proof:proofSheet,ai:aiSheet,notif:notifSheet,comments:commentsSheet,city:citySheet}[S.sheet];html+=`<div class="sheet" onclick="if(event.target===this){S.first=0;sheet(null)}"><div class="in">${f()}</div></div>`}
 if(S.toast)html+=`<div class="toast" role="status">${ic('check',16,'#C6F25E',2.2)}${S.toast}</div>`;
 root.innerHTML=html;
 const ns=root.querySelector('.scroll');if(ns&&keep)ns.scrollTop=keep;
 if(ns&&S.route==='tabs'&&S.tab==='comm'&&S.commTab==='feed')ns.onscroll=()=>{if(ns.scrollTop+ns.clientHeight*1.5>ns.scrollHeight&&!S.more){S.more=1;S.feedN+=6;render();S.more=0}};
 const nf=root.querySelector('#feed');if(nf){if(reset)nf.scrollTop=(S.vi||0)*nf.clientHeight;else nf.scrollTop=fy}
 if(root.querySelector('#gm'))initMap();
 if(focusId){const el=document.getElementById(focusId);if(el){el.focus();try{if(sel!=null)el.setSelectionRange(sel,sel)}catch(e){}}}
 loadImgs();
}
render(true);
</script>
</body></html>
